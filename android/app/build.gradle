plugins {
    id 'com.android.application'
}

android {
    namespace 'de.psaimusic.beatlab'
    compileSdk 35

    defaultConfig {
        applicationId 'de.psaimusic.beatlab'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
