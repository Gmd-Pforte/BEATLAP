<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beatlab – Offline</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0910;color:#f5f1fb;font:16px system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px}
main{max-width:440px;text-align:center}h1{font-size:30px;margin:12px 0;color:#f5f1fb}p{color:#b3a9c2;line-height:1.6}button{border:0;padding:16px 26px;border-radius:14px;color:#0b0910;font-size:16px;font-weight:800;background:linear-gradient(110deg,#ff4fa0,#2f9bff);cursor:pointer}
.logo{display:inline-grid;place-items:center;width:96px;height:96px;border-radius:50%;border:5px solid #ff4fa0;color:#f5f1fb;font-weight:900;font-size:23px;box-shadow:0 0 0 2px #2f9bff inset}
</style>
</head>
<body><main>
<div class="logo">PS</div>
<h1>Beatlab ist gerade offline</h1>
<p>Bitte prüfe deine Internetverbindung. Beim nächsten Öffnen lädt die App automatisch die aktuelle Studio-Version.</p>
<button onclick="window.BeatlabAndroid?.retry?.()">Erneut verbinden</button>
<p style="font-size:13px">Deine lokal gespeicherten Projekte werden dadurch nicht gelöscht.</p>
</main></body>
</html>
